name: Build and release AgeniusNote Lite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } elseif ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION
          } else {
            $v = (Get-Content packaging/VERSION -Raw).Trim()
          }
          Write-Host "Version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build PyInstaller bundle
        run: python -m PyInstaller packaging/ageniusnote_lite.spec --noconfirm --clean --distpath dist-build --workpath build-build

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSrcDir=..\dist-build\AgeniusNoteLite" "/DOutDir=..\dist-build\installer" "packaging/installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgeniusNoteLite-Windows
          path: dist-build/installer/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-build/installer/*.exe
          name: AgeniusNote Lite v${{ steps.ver.outputs.version }}
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    env:
      # All optional. If MACOS_CERT_P12_BASE64 is empty the build runs unsigned
      # (the pre-notarization behavior) and still ships a DMG.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
      APPLE_NOTARY_PWD: ${{ secrets.APPLE_NOTARY_PWD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            v="$INPUT_VERSION"
          else
            v="$(tr -d '[:space:]' < packaging/VERSION)"
          fi
          echo "Version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERT_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Make the imported keychain searchable and allow codesign to use the
          # key without an interactive prompt.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null

      - name: Build .app + .dmg (sign + notarize when secrets present)
        run: |
          chmod +x packaging/build.sh
          PYTHON=python ./packaging/build.sh "${{ steps.ver.outputs.version }}"
        env:
          # build.sh skips signing/notarization when these are empty.
          VN_SIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          VN_NOTARY_APPLE_ID: ${{ env.APPLE_NOTARY_ID }}
          VN_NOTARY_PASSWORD: ${{ env.APPLE_NOTARY_PWD }}
          VN_NOTARY_TEAM_ID: ${{ env.APPLE_TEAM_ID }}

      - name: Locate DMG
        id: dmg
        run: |
          dmg="$(ls dist-build-mac-*/*.dmg | head -1)"
          echo "Built: $dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgeniusNoteLite-macOS
          path: dist-build-mac-*/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          name: AgeniusNote Lite v${{ steps.ver.outputs.version }}
          generate_release_notes: true
